name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Create ZIP archive
        run: |
          zip -r agentic-workflow-search-engine-mcp.zip . -x "*.git*" "*node_modules*" "*.github*" "artifacts*"
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: agentic-workflow-search-engine-mcp.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
